# ═══════════════════════════════════════════════════════════════════
#  Apache Flume Agent Configuration
#  Pipeline: Spooling Directory  →  Memory Channel  →  HDFS Sink
# ═══════════════════════════════════════════════════════════════════

# ── Agent Declaration ──────────────────────────────────────────────
agent.sources  = spoolSource
agent.channels = memChannel
agent.sinks    = hdfsSink

# ══════════════════════════════════════════════════════════════════
#  SOURCE  —  SpoolingDirectorySource
#  Watches /opt/spooling_dir for new files; marks processed files
#  with a ".COMPLETED" suffix so they are never re-read.
# ══════════════════════════════════════════════════════════════════
agent.sources.spoolSource.type              = spooldir
agent.sources.spoolSource.spoolDir          = /opt/spooling_dir
agent.sources.spoolSource.fileHeader        = true
agent.sources.spoolSource.fileHeaderKey     = file
agent.sources.spoolSource.fileSuffix        = .COMPLETED
agent.sources.spoolSource.deletePolicy      = never
agent.sources.spoolSource.deserializer      = LINE
agent.sources.spoolSource.deserializer.maxLineLength = 4096
agent.sources.spoolSource.inputCharset      = UTF-8
agent.sources.spoolSource.channels         = memChannel

# ══════════════════════════════════════════════════════════════════
#  CHANNEL  —  MemoryChannel
#  Fast in-memory buffer; tune capacity to handle burst traffic.
# ══════════════════════════════════════════════════════════════════
agent.channels.memChannel.type              = memory
agent.channels.memChannel.capacity         = 100000
agent.channels.memChannel.transactionCapacity = 10000
agent.channels.memChannel.keep-alive       = 30

# ══════════════════════════════════════════════════════════════════
#  SINK  —  HDFSSink
#  Writes to /flume/logs/YYYY-MM-DD/  with DataStream file type.
#  Files roll on size (128 MB) or time (600 s) — whichever comes
#  first, so HDFS sees reasonably-sized blocks.
# ══════════════════════════════════════════════════════════════════
agent.sinks.hdfsSink.type                  = hdfs
agent.sinks.hdfsSink.channel              = memChannel

# Path uses Flume time-escape sequences for date partitioning
agent.sinks.hdfsSink.hdfs.path            = hdfs://namenode:9000/flume/logs/%Y-%m-%d

# File type: DataStream = raw bytes, no Hadoop-specific wrapping
agent.sinks.hdfsSink.hdfs.fileType        = DataStream
agent.sinks.hdfsSink.hdfs.writeFormat     = Text

# File naming
agent.sinks.hdfsSink.hdfs.filePrefix      = access-log-
agent.sinks.hdfsSink.hdfs.fileSuffix      = .log
agent.sinks.hdfsSink.hdfs.inUsePrefix     = _tmp_
agent.sinks.hdfsSink.hdfs.inUseSuffix     = .tmp

# Roll policy — size (128 MB), interval (10 min), count (0 = disabled)
agent.sinks.hdfsSink.hdfs.rollSize        = 134217728
agent.sinks.hdfsSink.hdfs.rollInterval    = 600
agent.sinks.hdfsSink.hdfs.rollCount       = 0

# Round timestamps to the nearest second for path substitution
agent.sinks.hdfsSink.hdfs.round           = true
agent.sinks.hdfsSink.hdfs.roundValue      = 10
agent.sinks.hdfsSink.hdfs.roundUnit       = second

# HDFS I/O performance
agent.sinks.hdfsSink.hdfs.batchSize       = 10000
agent.sinks.hdfsSink.hdfs.threadsPoolSize = 10
agent.sinks.hdfsSink.hdfs.callTimeout     = 60000
agent.sinks.hdfsSink.hdfs.idleTimeout     = 60

# Use wall-clock time for path substitution (not the event header)
agent.sinks.hdfsSink.hdfs.useLocalTimeStamp = true
